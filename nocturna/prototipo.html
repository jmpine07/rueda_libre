<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rueda Nocturna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              glow: '0 0 30px rgba(16, 185, 129, 0.35)'
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-white antialiased">
    <main class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.22),_transparent_35%),linear-gradient(135deg,#020617_0%,#0f172a_45%,#022c22_100%)]">
      <section class="mx-auto max-w-7xl px-6 py-12 sm:px-8 lg:px-12 lg:py-20">
        <div class="grid items-center gap-10 lg:grid-cols-[1.05fr_0.95fr]">
          <div class="max-w-xl">
            <p class="inline-flex items-center rounded-full border border-emerald-400/40 bg-emerald-500/10 px-4 py-2 text-[11px] font-bold uppercase tracking-[0.22em] text-emerald-300">
              Nuevo · Jueves a sábado
            </p>

            <h1 class="mt-6 text-4xl font-black leading-none tracking-tight text-white sm:text-5xl lg:text-7xl">
              Rueda Nocturna
            </h1>

            <p class="mt-5 max-w-lg text-lg leading-relaxed text-slate-300 sm:text-xl">
              Descubre Medellín en bici cuando se encienden las luces
            </p>

            <div class="mt-8 flex flex-wrap gap-4">
              <div class="min-w-[150px] rounded-2xl border border-white/10 bg-white/5 px-4 py-4 shadow-xl shadow-slate-950/30 backdrop-blur-sm">
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Rutas</p>
                <p class="mt-2 text-2xl font-black text-white">3 rutas</p>
              </div>

              <div class="min-w-[150px] rounded-2xl border border-emerald-400/20 bg-emerald-500/10 px-4 py-4 shadow-xl shadow-emerald-900/20 backdrop-blur-sm">
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-200">Desde</p>
                <p class="mt-2 text-2xl font-black text-emerald-300">$55.000</p>
              </div>
            </div>

            <div class="mt-8 flex flex-wrap items-center gap-4">
              <a
                href="#"
                class="inline-flex items-center justify-center rounded-full bg-emerald-500 px-7 py-3.5 text-base font-bold text-slate-950 shadow-[0_0_30px_rgba(16,185,129,0.45)] transition duration-200 hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-300/60"
              >
                Inscríbete
              </a>

              <a
                href="#"
                class="inline-flex items-center justify-center rounded-full border border-white/15 bg-white/5 px-6 py-3 text-base font-semibold text-white transition duration-200 hover:border-emerald-400/50 hover:bg-emerald-500/10 focus:outline-none focus:ring-4 focus:ring-white/20"
              >
                Ver rutas
              </a>
            </div>

            <div class="mt-10 flex flex-wrap items-center gap-6 text-sm text-slate-300">
              <div class="flex items-center gap-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
                Guías certificados
              </div>
              <div class="flex items-center gap-2">
                <span class="inline-flex h-2.5 w-2.5 rounded-full bg-amber-400"></span>
                Luces y seguridad
              </div>
            </div>
          </div>

          <div class="relative">
            <div class="absolute -inset-6 rounded-[2rem] bg-emerald-500/20 blur-3xl"></div>

            <div class="relative overflow-hidden rounded-[2rem] border border-white/10 bg-slate-900/70 p-4 shadow-[0_30px_80px_rgba(2,6,23,0.9)] backdrop-blur-sm sm:p-5">
              <img
                src="https://images.unsplash.com/photo-1541625602330-2277a4c46182?auto=format&fit=crop&w=1200&q=80"
                alt="Ciclistas en la ciudad por la noche"
                class="h-[460px] w-full rounded-[1.5rem] object-cover"
              />

              <div class="absolute inset-x-8 bottom-8 rounded-2xl border border-white/10 bg-slate-950/70 p-4 backdrop-blur-md">
                <div class="flex items-center justify-between gap-4 text-white">
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-[0.24em] text-slate-400">Salida</p>
                    <p class="mt-2 text-2xl font-black">19:30 hs</p>
                  </div>

                  <div class="rounded-full border border-emerald-400/40 bg-emerald-500/10 px-3 py-2 text-xs font-bold uppercase tracking-[0.18em] text-emerald-300">
                    Night Ride
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
